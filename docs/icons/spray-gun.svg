<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f0f14"/>
      <stop offset="0.35" stop-color="#e3262d"/>
      <stop offset="0.6" stop-color="#ff6a6f"/>
      <stop offset="1" stop-color="#a5141a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="0.45" stop-color="#b9bcc2"/>
      <stop offset="1" stop-color="#6d7078"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a7d85"/>
      <stop offset="0.5" stop-color="#e6e8ec"/>
      <stop offset="1" stop-color="#80838b"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.5" stop-color="#55555c"/>
      <stop offset="1" stop-color="#25252a"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="66" cy="108" rx="26" ry="5" fill="url(#shadow)"/>
  <!-- paint cup -->
  <path d="M46 10 h28 l-3 30 h-22 z" fill="url(#cup)"/>
  <rect x="44" y="6" width="32" height="7" rx="3.5" fill="#c51c22"/>
  <rect x="56" y="2" width="8" height="6" rx="2" fill="#8f0f14"/>
  <rect x="55" y="40" width="10" height="8" fill="url(#steelV)"/>
  <!-- body -->
  <rect x="30" y="46" width="62" height="16" rx="8" fill="url(#steel)"/>
  <!-- nozzle -->
  <path d="M30 49 L16 51 L16 57 L30 59 Z" fill="url(#steel)"/>
  <rect x="10" y="49" width="7" height="10" rx="2" fill="#3a3a40"/>
  <!-- rear knobs -->
  <rect x="90" y="49" width="10" height="10" rx="3" fill="url(#steel)"/>
  <rect x="99" y="51" width="6" height="6" rx="2" fill="#3a3a40"/>
  <!-- trigger -->
  <path d="M50 62 C44 74 46 86 52 92" stroke="#9ea1a8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- handle -->
  <path d="M64 60 L80 60 L86 104 Q86 108 82 108 L72 108 Q68 108 68 104 Z" fill="url(#grip)"/>
  <!-- air fitting -->
  <rect x="72" y="106" width="10" height="7" rx="2" fill="url(#steelV)"/>
  <!-- highlight -->
  <rect x="36" y="48" width="48" height="3" rx="1.5" fill="#fff" opacity="0.6"/>
</svg>
